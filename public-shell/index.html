<!doctype html>
<!--
  This file is not the app — it's an offline fallback only. Capacitor's
  server.url mode (see capacitor.config.ts) makes the WebView load the
  real, live site at dhabpari.com on every launch; this page briefly
  shows only if that load hasn't finished yet, or if the phone has no
  connection at all.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dhab Pari</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0f3d2e; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .wrap { text-align: center; padding: 24px; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 16px;
      border: 3px solid rgba(255,255,255,0.25); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 14px; opacity: 0.85; margin: 4px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>Dhab Pari</p>
    <p id="msg">Connecting...</p>
  </div>
  <script>
    // If server.url somehow fails to take over, at least tell the user
    // it's a connection problem rather than leaving a bare spinner.
    setTimeout(function () {
      document.getElementById('msg').textContent = 'Could not connect — check your internet connection.';
    }, 8000);
  </script>
</body>
</html>
