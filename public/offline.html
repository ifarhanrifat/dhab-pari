<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Dhab Pari</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #0B3B2E; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
  }
  .card { max-width: 380px; }
  img { width: 84px; height: 84px; border-radius: 18px; margin-bottom: 20px; }
  h1 { font-size: 22px; line-height: 30px; margin: 0 0 10px; font-weight: 700; }
  p { font-size: 15px; line-height: 24px; margin: 0 0 22px; color: rgba(255,255,255,.75); }
  .ur { font-size: 15px; line-height: 30px; color: rgba(255,255,255,.65); margin-top: 14px; direction: rtl; }
  button {
    background: #1D9E75; color: #fff; border: 0; border-radius: 10px;
    padding: 12px 26px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Dhab Pari" />
    <h1>You're offline</h1>
    <p>This page needs an internet connection. Check your signal or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
    <p class="ur">انٹرنیٹ کنکشن دستیاب نہیں۔ براہِ کرم اپنا کنکشن چیک کر کے دوبارہ کوشش کریں۔</p>
  </div>
</body>
</html>
